server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;    # git에서 받은 html 위치
    index index.php index.html;


    # 헬스체크 엔드포인트
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }


# 2. PHP 파일 처리 (추가됨!)
    # 이 블록이 있어야 index.php 안의 AWS 메타데이터 로직이 실행됩니다.
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000; # Supervisor로 띄운 php-fpm 주소
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }


    location / {
        try_files $uri $uri/ /index.php;  # html 파일 서빙
    }

    # 모든 요청을 WAS로 프록시
    location /petclinic {
        proxy_pass         http://was-svc:80;
        #proxy_pass         http://172.20.206.122:80;
        proxy_http_version 1.1;

        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
